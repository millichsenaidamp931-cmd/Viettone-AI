<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172333">
<meta name="description" content="VietTone AI – Luyện nghe và phát âm 6 thanh điệu tiếng Việt cùng Bé Lạc khám phá cảnh đẹp các vùng miền Việt Nam.">
<title>VietTone AI | Học trọn vẹn 6 thanh tiếng Việt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#172333;--red:#ef233c;--orange:#ff9100;--cream:#fff7eb;--white:#fff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;background:#172333;color:var(--navy)}
button,a{font:inherit}button{cursor:pointer}a{text-decoration:none}img{max-width:100%}
a:focus-visible,button:focus-visible{outline:3px solid #60a5fa;outline-offset:4px}

.hero{position:relative;width:100%;height:100vh;height:100svh;overflow:hidden;background:#87542d url("./assets/scene-bg.jpg") center center/cover no-repeat;color:white;isolation:isolate;display:flex;align-items:center;justify-content:center}
.hero:before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,rgba(30,26,24,.74) 0%,rgba(39,27,19,.59) 24%,rgba(40,28,22,.11) 54%,rgba(40,28,22,.08) 100%),linear-gradient(0deg,rgba(22,19,16,.28),transparent 28%);animation:bgReveal .55s ease-out both}
@keyframes bgReveal{0%{opacity:.2}100%{opacity:1}}

.hero-inner{position:relative;z-index:3;width:min(1470px,94%);height:100%;margin:0 auto;display:flex;align-items:center}
.copy{position:relative;z-index:7;width:min(550px,46%);text-shadow:0 2px 12px rgba(0,0,0,.15)}
.eyebrow{display:inline-block;color:#61230f;background:#fff0d7;padding:12px 18px;border-radius:45px 18px 45px 13px;font-weight:800;font-size:14px;line-height:1.45;text-shadow:none;max-width:360px}
h1{font-size:clamp(40px,4.5vw,74px);line-height:1.14;letter-spacing:-1.8px;margin:20px 0 16px;font-weight:800;animation:fadeInUp .65s cubic-bezier(.16,1,.3,1) 1.35s both}
h1 em{font-style:normal;color:#ffd68b;text-shadow:0 3px 18px rgba(240,72,13,.4)}
.lead{font-size:clamp(14px,1.18vw,18px);line-height:1.75;max-width:540px;color:#fff9ed;margin:0;animation:fadeInUp .65s cubic-bezier(.16,1,.3,1) 1.50s both}
.actions{display:flex;gap:14px;align-items:center;margin-top:28px;animation:fadeInUp .65s cubic-bezier(.16,1,.3,1) 1.65s both}

@keyframes fadeInUp{
  0%{opacity:0;transform:translate3d(0,26px,0)}
  100%{opacity:1;transform:translate3d(0,0,0)}
}
@keyframes fadeIn{
  0%{opacity:0}
  100%{opacity:1}
}

.cta{border:0;border-radius:999px;background:linear-gradient(105deg,#e92025,#ff9100);color:#fff;font-weight:800;font-size:16px;padding:15px 32px;display:inline-flex;align-items:center;gap:10px;justify-content:center;transition:transform .2s,filter .2s,box-shadow .2s;white-space:nowrap;box-shadow:0 8px 24px rgba(233,32,37,.35)}
.cta:hover{transform:translateY(-2px)!important;filter:brightness(1.08);box-shadow:0 12px 28px rgba(233,32,37,.45)}
.cta:active{transform:translateY(0)!important}

.mascot-stage{position:absolute;z-index:5;width:clamp(340px,43vw,700px);right:15%;bottom:4%;aspect-ratio:519/543;pointer-events:none;will-change:transform;transition:transform .14s ease-out}
.mascot-intro{display:block;width:100%;height:100%;animation:mascotFlyIn .85s cubic-bezier(.18,.89,.32,1.15) .3s both}
.mascot-float{display:block;width:100%;height:100%;animation:float 4.4s ease-in-out infinite;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 16px 16px rgba(45,20,4,.22))}
.mascot-float img{width:100%;height:100%;object-fit:contain;display:block}

@keyframes mascotFlyIn{
  0%{opacity:0;transform:translate3d(110px,100px,0) scale(.55) rotate(7deg);filter:blur(4px)}
  72%{opacity:1;transform:translate3d(-10px,-14px,0) scale(1.04) rotate(-2deg);filter:blur(0)}
  100%{opacity:1;transform:translate3d(0,0,0) scale(1) rotate(0deg);filter:blur(0)}
}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}

.tones{position:absolute;inset:0;z-index:6;pointer-events:none}
.tone{
  position:absolute;
  pointer-events:auto;
  width:96px;
  height:88px;
  background-image:radial-gradient(circle at 50% 40%, rgba(255,255,255,.45) 0%, transparent 68%), repeating-linear-gradient(90deg, transparent 0, transparent 15px, rgba(255,255,255,.18) 15px, rgba(0,0,0,.08) 17px), var(--lantern-bg);
  background-blend-mode:screen, normal, normal;
  border:2px solid rgba(255,255,255,.65);
  box-shadow:0 8px 24px var(--lantern-glow), inset 0 0 16px rgba(255,255,255,.3);
  border-radius:46% 46% 48% 48% / 54% 54% 46% 46%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  padding:6px 6px;
  color:var(--tone-color, #fff);
  transform:rotate(var(--rot,0));
  transition:transform .24s cubic-bezier(.34,1.56,.64,1), filter .2s, box-shadow .24s;
  animation:toneFlyIn .52s cubic-bezier(.34,1.56,.64,1) both;
  user-select:none;
}
/* Chuôi lồng đèn gỗ/vàng trên */
.tone:before{
  content:"";
  position:absolute;
  top:-7px;
  left:50%;
  transform:translateX(-50%);
  width:26px;
  height:7px;
  background:linear-gradient(180deg,#ffd700,#996515);
  border-radius:3px 3px 1px 1px;
  box-shadow:0 -3px 0 -1.5px #ffe066, 0 1px 2px rgba(0,0,0,.35);
  z-index:3;
}
/* Tua rua lụa đỏ vàng dưới lồng đèn */
.tone:after{
  content:"";
  position:absolute;
  bottom:-20px;
  left:50%;
  transform:translateX(-50%);
  width:7px;
  height:20px;
  background:linear-gradient(180deg,#996515 0%,#ffd700 20%,#d90429 20%,#b70919 100%);
  border-radius:0 0 4px 4px;
  box-shadow:0 3px 6px rgba(0,0,0,.35);
  transform-origin:top center;
  transition:transform .3s ease;
  z-index:1;
}

.tone-line-prefix, .tone-word{font-size:13px;font-weight:700;color:var(--name-color,#fff);opacity:.95;letter-spacing:.3px;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.tone-line-name, .tone-name{font-size:22px;font-weight:800;line-height:1.08;color:var(--tone-color,#fff);text-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .2s;white-space:nowrap}

.tone:hover{transform:rotate(0) scale(1.16)!important;filter:brightness(1.12);box-shadow:0 14px 34px var(--lantern-glow), inset 0 0 20px rgba(255,255,255,.5);z-index:12;animation-play-state:paused}
.tone:hover:after{transform:translateX(-50%) rotate(12deg)}

@keyframes toneFlyIn{
  0%{opacity:0;transform:translate3d(0,38px,0) rotate(var(--rot,0)) scale(.35)}
  75%{opacity:1;transform:translate3d(0,-6px,0) rotate(var(--rot,0)) scale(1.12)}
  100%{opacity:1;transform:translate3d(0,0,0) rotate(var(--rot,0)) scale(1)}
}

@keyframes toneGentleFloat{
  0%,100%{transform:translateY(0) rotate(var(--rot,0))}
  50%{transform:translateY(-5px) rotate(calc(var(--rot,0) + 1.2deg))}
}
body.intro-ready .tone{animation:toneGentleFloat 4s ease-in-out infinite}
body.intro-ready .tone[data-tone=ngang]{animation-delay:0s}
body.intro-ready .tone[data-tone=sac]{animation-delay:.6s}
body.intro-ready .tone[data-tone=huyen]{animation-delay:1.2s}
body.intro-ready .tone[data-tone=hoi]{animation-delay:1.8s}
body.intro-ready .tone[data-tone=nga]{animation-delay:2.4s}
body.intro-ready .tone[data-tone=nang]{animation-delay:3.0s}

/* 6 màu sắc lồng đèn Việt Nam rực rỡ đặc trưng */
/* 1. Thanh Ngang: Lồng đèn Vàng Hổ Phách Hội An */
.tone[data-tone=ngang]{
  left:34%;top:31%;--rot:-13deg;animation-delay:.75s;
  --lantern-bg:linear-gradient(180deg,#fff3b0 0%,#ffb703 50%,#e08500 100%);
  --lantern-glow:rgba(255,183,3,.6);
  --tone-color:#611c07;
  --name-color:#4a1503;
}
/* 2. Thanh Sắc: Lồng đèn Đỏ Thắm Lụa Hà Đông */
.tone[data-tone=sac]{
  left:39%;top:15%;--rot:11deg;animation-delay:.88s;
  --lantern-bg:linear-gradient(180deg,#ff8591 0%,#e63946 50%,#9e0c1b 100%);
  --lantern-glow:rgba(230,57,70,.6);
  --tone-color:#ffffff;
  --name-color:#ffe4e6;
}
/* 3. Thanh Huyền: Lồng đèn Xanh Lam Ngọc Bích */
.tone[data-tone=huyen]{
  right:21%;top:18%;--rot:-11deg;animation-delay:1.01s;
  --lantern-bg:linear-gradient(180deg,#7dd3fc 0%,#0284c7 50%,#034f77 100%);
  --lantern-glow:rgba(2,132,199,.6);
  --tone-color:#ffffff;
  --name-color:#e0f2fe;
}
/* 4. Thanh Hỏi: Lồng đèn Tím Hoàng Cung Cố Đô */
.tone[data-tone=hoi]{
  right:11%;top:31%;--rot:10deg;animation-delay:1.14s;
  --lantern-bg:linear-gradient(180deg,#e9d5ff 0%,#9333ea 50%,#581c87 100%);
  --lantern-glow:rgba(147,51,234,.6);
  --tone-color:#ffffff;
  --name-color:#f3e8ff;
}
/* 5. Thanh Ngã: Lồng đèn Hồng Cánh Sen */
.tone[data-tone=nga]{
  right:12%;top:52%;--rot:-7deg;animation-delay:1.27s;
  --lantern-bg:linear-gradient(180deg,#fbcfe8 0%,#ec4899 50%,#9d174d 100%);
  --lantern-glow:rgba(236,72,153,.6);
  --tone-color:#ffffff;
  --name-color:#fce7f3;
}
/* 6. Thanh Nặng: Lồng đèn Xanh Trúc Bách */
.tone[data-tone=nang]{
  right:27%;top:67%;--rot:8deg;animation-delay:1.40s;
  --lantern-bg:linear-gradient(180deg,#bef264 0%,#16a34a 50%,#14532d 100%);
  --lantern-glow:rgba(22,163,74,.6);
  --tone-color:#ffffff;
  --name-color:#f0fdf4;
}

.subfeatures{position:absolute;z-index:6;right:3.5%;bottom:8%;display:grid;gap:12px;color:#fff6e2;font-weight:700;font-size:16px;text-shadow:0 2px 8px rgba(0,0,0,.6);animation:fadeIn .55s ease-out 1.80s both}
.subfeatures span{border-left:3px solid #ffcc77;padding-left:11px}
.hero-note{position:absolute;z-index:6;bottom:20px;left:3%;color:#fff3df;font-size:12px;opacity:.78;cursor:pointer;user-select:none;transition:opacity .2s;animation:fadeIn .55s ease-out 1.90s both}
.hero-note:hover{opacity:1}

@media(max-width:1050px){
  .copy{width:49%}
  .mascot-stage{right:4%;width:49vw}
  .tone{width:88px;height:80px}
  .tone:before{width:22px;height:6px;top:-6px}
  .tone:after{height:18px;bottom:-18px;width:6px}
  .tone-line-prefix, .tone-word{font-size:12px}
  .tone-line-name, .tone-name{font-size:19px}
  .subfeatures{display:none}
}

@media(max-width:760px){
  .hero{background-position:58% center}
  .hero:before{background:linear-gradient(180deg,rgba(29,22,18,.72),rgba(29,22,18,.35) 46%,rgba(29,22,18,.12) 85%)}
  .hero-inner{width:92%;display:block;padding:36px 0 0}
  .copy{width:100%;margin:0;text-align:center}
  .eyebrow{font-size:11px;padding:9px 13px}
  h1{font-size:clamp(34px,7.5vw,48px);margin:16px 0 12px;letter-spacing:-1.3px}
  .lead{font-size:14px;line-height:1.6;max-width:480px;margin:0 auto}
  .actions{justify-content:center;margin-top:20px}
  .cta{padding:13px 26px;font-size:14px}
  .mascot-stage{width:min(86vw,460px);right:7%;bottom:5%}
  .tones{inset:auto 0 0;top:280px}
  .tone{width:76px;height:70px;border-radius:44% 44% 46% 46% / 52% 52% 48% 48%;padding:4px}
  .tone:before{width:20px;height:5px;top:-5px}
  .tone:after{height:15px;bottom:-15px;width:5px}
  .tone-line-prefix, .tone-word{font-size:10.5px}
  .tone-line-name, .tone-name{font-size:16px}
  .tone[data-tone=ngang]{left:7%;top:26%}
  .tone[data-tone=sac]{left:14%;top:9%}
  .tone[data-tone=huyen]{right:16%;top:10%}
  .tone[data-tone=hoi]{right:5%;top:28%}
  .tone[data-tone=nga]{right:7%;top:58%}
  .tone[data-tone=nang]{left:9%;top:59%}
  .hero-note{bottom:12px;left:5%;font-size:11px}
}

@media(max-width:390px){
  .hero-inner{padding:28px 0 0}
  .actions .cta{font-size:13px;padding:12px 22px}
  .mascot-stage{bottom:6%}
  .tone{width:68px;height:62px}
  .tone:before{width:16px;height:4px;top:-4px}
  .tone:after{height:12px;bottom:-12px;width:4px}
  .tone-line-prefix, .tone-word{font-size:9.5px}
  .tone-line-name, .tone-name{font-size:14px}
}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important;opacity:1!important}
  .mascot-intro{animation:none!important;opacity:1!important;transform:none!important}
  .tone{animation:none!important;opacity:1!important;transform:rotate(var(--rot,0))!important}
  .tone:after{transform:translateX(-50%)!important}
  h1,.lead,.actions,.subfeatures,.hero-note{animation:none!important;opacity:1!important;transform:none!important}
}
</style>
<script>
// Danh sách cảnh đẹp các vùng miền Việt Nam phong cách 3D hoạt hình tươi sáng cùng Bé Lạc
const SCENE_BACKGROUNDS = [
  { src: './assets/scene-bg-1.jpg', note: 'VietTone AI · Vịnh Hạ Long 3D kỳ vĩ bên làn nước ngọc bích (Miền Bắc)' },
  { src: './assets/scene-bg-2.jpg', note: 'VietTone AI · Ruộng bậc thang Tây Bắc 3D mùa lúa vàng óng ả (Tây Bắc)' },
  { src: './assets/scene-bg-3.jpg', note: 'VietTone AI · Phố cổ Hội An 3D lung linh sắc màu lồng đèn (Miền Trung)' },
  { src: './assets/scene-bg-4.jpg', note: 'VietTone AI · Cố đô Huế 3D thơ mộng bên dòng sông Hương (Miền Trung)' },
  { src: './assets/scene-bg-5.jpg', note: 'VietTone AI · Chợ nổi sông nước Miền Tây 3D trĩu quả ghe thuyền (Miền Nam)' },
  { src: './assets/scene-bg.jpg', note: 'VietTone AI · Cao nguyên Đà Lạt 3D rực rỡ hoa dã quỳ và đồi chè (Tây Nguyên)' }
];

// Chọn ngẫu nhiên khi mở trang
const initialSceneIndex = Math.floor(Math.random() * SCENE_BACKGROUNDS.length);
window.__VIETTONE_ACTIVE_SCENE_INDEX = initialSceneIndex;
window.__VIETTONE_ACTIVE_SCENE = SCENE_BACKGROUNDS[initialSceneIndex];

// Áp dụng ngay trước khi trang hiển thị để tránh nháy ảnh
const sceneStyle = document.createElement('style');
sceneStyle.id = 'dynamic-scene-bg-style';
sceneStyle.textContent = `.hero{background-image:url("${window.__VIETTONE_ACTIVE_SCENE.src}") !important}`;
document.head.appendChild(sceneStyle);

</head>

<body>
<section class="hero" id="home">
  <div class="hero-inner">
    <div class="copy">
      <h1>Học trọn vẹn<br><em>6 thanh tiếng Việt</em></h1>
      <p class="lead">Cùng Bé Lạc luyện nghe, luyện nói và khám phá thanh điệu tiếng Việt bằng trí tuệ nhân tạo.</p>

        <span class="tone-line-prefix">Thanh</span>
        <span class="tone-line-name">Sắc</span>
      </button>
      <button class="tone" data-tone="huyen" data-word="Thanh Huyền" aria-label="Thanh Huyền">
        <span class="tone-line-prefix">Thanh</span>
        <span class="tone-line-name">Huyền</span>
      </button>
      <button class="tone" data-tone="hoi" data-word="Thanh Hỏi" aria-label="Thanh Hỏi">
        <span class="tone-line-prefix">Thanh</span>
        <span class="tone-line-name">Hỏi</span>
      </button>
      <button class="tone" data-tone="nga" data-word="Thanh Ngã" aria-label="Thanh Ngã">

<script>
// CHỈ THAY ĐỔI DÒNG DƯỚI nếu đường dẫn trang học trong dự án không phải /app.
const APP_PATH = '/app';
function openApp(toneId) {
  const url = APP_PATH + (toneId ? '?tone=' + encodeURIComponent(toneId) : '');
  if (window.parent !== window) {
    // Nếu Home đang hiển thị trong iframe của React, gửi sự kiện cho trang cha.
    window.parent.postMessage({
      type: 'VIETTONE_NAVIGATE',
      action: 'openLearning',
      path: APP_PATH,
      tone: toneId || null,
      toneId: toneId || null
    }, window.location.origin);
    // Dự phòng nếu React chưa cài trình lắng nghe: mở trang học trong iframe.
    setTimeout(() => { if (document.documentElement.isConnected) window.location.assign(url); }, 500);
  } else {
    window.location.assign(url);
  }
}

document.querySelectorAll('[data-app]').forEach(el => el.addEventListener('click', ev => {
  ev.preventDefault();
  openApp();
}));

document.querySelectorAll('[data-tone]').forEach(el => el.addEventListener('click', (ev) => {
  ev.preventDefault();
  openApp(el.dataset.tone);
}));

// Phát âm thanh khi hover vào từng thẻ thanh điệu
let activeToneAudioCtx = null;
let hoverAudioTimer = null;

function playTonePitch(toneId) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    if (!activeToneAudioCtx || activeToneAudioCtx.state === 'closed') {
      activeToneAudioCtx = new AudioCtx();
    }
    if (activeToneAudioCtx.state === 'suspended') {
      activeToneAudioCtx.resume();
    }
    const ctx = activeToneAudioCtx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const now = ctx.currentTime;

    osc.type = 'triangle';
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.18, now + 0.04);

    switch (toneId) {
      case 'ngang':
        osc.frequency.setValueAtTime(330, now);
        osc.frequency.linearRampToValueAtTime(330, now + 0.5);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
        osc.start(now);
        osc.stop(now + 0.55);
        break;
      case 'sac':
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(490, now + 0.45);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
        break;
      case 'huyen':
        osc.frequency.setValueAtTime(310, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.5);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
        osc.start(now);
        osc.stop(now + 0.55);
        break;
      case 'hoi':
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.25);
        osc.frequency.exponentialRampToValueAtTime(320, now + 0.55);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
        break;
      case 'nga':
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.22);
        gain.gain.setValueAtTime(0.02, now + 0.24);
        gain.gain.setValueAtTime(0.16, now + 0.28);
        osc.frequency.exponentialRampToValueAtTime(460, now + 0.5);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
        osc.start(now);
        osc.stop(now + 0.55);
        break;
      case 'nang':
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.28);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
        osc.start(now);
        osc.stop(now + 0.33);
        break;
      default:
        osc.frequency.setValueAtTime(330, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.start(now);
        osc.stop(now + 0.45);
    }
    osc.connect(gain);
    gain.connect(ctx.destination);
  } catch (err) {
    console.warn('Audio pitch error:', err);
  }
}

// Bộ đệm file âm thanh chuyên biệt cho từng thanh điệu (OGG + MP3 + WAV)
const toneAudioCache = {};
['ngang', 'sac', 'huyen', 'hoi', 'nga', 'nang'].forEach(t => {
  const audio = new Audio();
  const ogg = document.createElement('source');
  ogg.src = `./assets/tone-${t}.ogg`;
  ogg.type = 'audio/ogg';
  const mp3 = document.createElement('source');
  mp3.src = `./assets/tone-${t}.mp3`;
  mp3.type = 'audio/mpeg';
  const wav = document.createElement('source');
  wav.src = `./assets/tone-${t}.wav`;
  wav.type = 'audio/wav';
  audio.appendChild(ogg);
  audio.appendChild(mp3);
  audio.appendChild(wav);
  audio.preload = 'auto';
  toneAudioCache[t] = audio;
});

let currentToneAudio = null;

function speakWithFallbackSpeech(word) {
  if ('speechSynthesis' in window) {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = 'vi-VN';
      u.rate = 0.85;
      const viVoices = window.speechSynthesis.getVoices().filter(v => v.lang.includes('vi'));
      if (viVoices.length > 0) u.voice = viVoices[0];
      window.speechSynthesis.speak(u);
    } catch (e) {
      console.warn('Speech fallback error on hover:', e);
    }
  }
}

function speakToneWord(word, toneId) {
  // Dừng âm thanh đang phát trước đó nếu có
  if (currentToneAudio) {
    currentToneAudio.pause();
    currentToneAudio.currentTime = 0;
  }

  // Phát file âm thanh tương ứng của thẻ
  const toneAudio = toneAudioCache[toneId];
  if (toneAudio) {
    currentToneAudio = toneAudio;
    toneAudio.currentTime = 0;
    const playPromise = toneAudio.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {
        // Nếu file bị chặn bởi chính sách browser, dùng bộ tổng hợp cao độ và Web Speech API
        playTonePitch(toneId);
        speakWithFallbackSpeech(word);
      });
    }
  } else {
    playTonePitch(toneId);
    speakWithFallbackSpeech(word);
  }
}

document.querySelectorAll('.tone').forEach(el => {
  const toneId = el.dataset.tone;
  const word = el.dataset.word || el.querySelector('.tone-line-name')?.textContent || el.textContent.trim();

  el.addEventListener('mouseenter', () => {
    clearTimeout(hoverAudioTimer);
    hoverAudioTimer = setTimeout(() => {
      speakToneWord(word, toneId);
    }, 50);
  });

  el.addEventListener('focus', () => {
    clearTimeout(hoverAudioTimer);
    hoverAudioTimer = setTimeout(() => {
      speakToneWord(word, toneId);
    }, 50);
  });
});

const mascot = document.getElementById('mascot-stage');
if (window.matchMedia('(pointer:fine)').matches && !window.matchMedia('(prefers-reduced-motion:reduce)').matches) {
  let raf = 0, px = 0, py = 0;
  document.getElementById('home').addEventListener('pointermove', ev => {
    const b = ev.currentTarget.getBoundingClientRect();
    px = ((ev.clientX - b.left) / b.width - .5) * 23;
    py = ((ev.clientY - b.top) / b.height - .5) * 16;
    if (!raf) {
      raf = requestAnimationFrame(() => {
        mascot.style.transform = `translate3d(${px}px,${py}px,0)`;
        raf = 0;
      });
    }
  });
  document.getElementById('home').addEventListener('pointerleave', () => {
    mascot.style.transform = 'translate3d(0,0,0)';
  });
}

// Cập nhật chú thích và cho phép nhấn vào để đổi ngẫu nhiên sang cảnh khác
const heroNote = document.querySelector('.hero-note');
if (heroNote && window.__VIETTONE_ACTIVE_SCENE) {
  heroNote.textContent = window.__VIETTONE_ACTIVE_SCENE.note;
  heroNote.addEventListener('click', () => {
    let nextIdx;
    do {
      nextIdx = Math.floor(Math.random() * SCENE_BACKGROUNDS.length);
    } while (nextIdx === window.__VIETTONE_ACTIVE_SCENE_INDEX && SCENE_BACKGROUNDS.length > 1);
    window.__VIETTONE_ACTIVE_SCENE_INDEX = nextIdx;
    window.__VIETTONE_ACTIVE_SCENE = SCENE_BACKGROUNDS[nextIdx];
    document.getElementById('dynamic-scene-bg-style').textContent = `.hero{background-image:url("${window.__VIETTONE_ACTIVE_SCENE.src}") !important}`;
    heroNote.textContent = window.__VIETTONE_ACTIVE_SCENE.note;
  });
}

// Bật trạng thái sẵn sàng để bắt đầu chuyển động lơ lửng nhẹ nhàng sau 2s mở màn
setTimeout(() => {
  document.body.classList.add('intro-ready');
}, 2000);

// Âm thanh chào mừng của Bé Lạc khi load trang:
// "Cùng Bé Lạc luyện nghe, luyện nói và khám phá thanh điệu tiếng Việt bằng trí tuệ nhân tạo nhé"
const WELCOME_TEXT = 'Cùng Bé Lạc luyện nghe, luyện nói và khám phá thanh điệu tiếng Việt bằng trí tuệ nhân tạo nhé';
const welcomeAudio = document.getElementById('welcome-audio') || new Audio('./assets/welcome.mp3');
let hasSpoken = false;

function speakWithWebSpeech() {
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(WELCOME_TEXT);
    u.lang = 'vi-VN';
    u.rate = 0.9;
    u.pitch = 1.05;
    const viVoices = window.speechSynthesis.getVoices().filter(v => v.lang.includes('vi'));
    if (viVoices.length > 0) u.voice = viVoices[0];
    window.speechSynthesis.speak(u);
    hasSpoken = true;
  } catch (err) {
    console.warn('Speech synthesis error:', err);
  }
}

function playWelcomeAudio(force = false) {
  if (hasSpoken && !force) return;

  welcomeAudio.currentTime = 0;
  const playPromise = welcomeAudio.play();

  if (playPromise !== undefined) {
    playPromise.then(() => {
      hasSpoken = true;
    }).catch(err => {
      console.log('Autoplay unmuted blocked by browser policy, queuing for first interaction:', err);
      // Đợi lần chạm / tương tác đầu tiên của người dùng để phát ngay
      const playOnFirstTouch = () => {
        if (!hasSpoken) {
          welcomeAudio.play().then(() => {
            hasSpoken = true;
          }).catch(() => speakWithWebSpeech());
        }
        window.removeEventListener('pointerdown', playOnFirstTouch);
        window.removeEventListener('keydown', playOnFirstTouch);
      };
      window.addEventListener('pointerdown', playOnFirstTouch, { once: true });
      window.addEventListener('keydown', playOnFirstTouch, { once: true });
    });
  } else {
    speakWithWebSpeech();
  }
}

// Tự động phát âm thanh chào mừng sau khi Bé Lạc bay vào (~1.1s)
setTimeout(() => {
  playWelcomeAudio(false);
}, 1100);
</script>
